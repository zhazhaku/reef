version: "2"

linters:
  default: all
  disable:
    # TODO: Tweak for current project needs
    - containedctx
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustruct
    - funcorder
    - gochecknoglobals
    - gosmopolitan  # Project legitimately uses CJK text in tests (FTS5, token counting)
    - godot
    - intrange
    - ireturn
    - nlreturn
    - noctx
    - noinlineerr
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

    # TODO: Disabled, because they are failing at the moment, we should fix them and enable (step by step)
    - contextcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - ineffassign
    - lll
    - maintidx
    - mnd
    - modernize
    - nestif
    - nilnil
    - paralleltest
    - perfsprint
    - revive
    - staticcheck
    - tagalign
    - testifylint
    - thelper
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    gomoddirectives:
      replace-allow-list:
        - github.com/bwmarrin/discordgo
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 40
    gosec:
      includes:
        - G101  # Hardcoded credentials
        - G104  # Audit: not checking errors
        - G106  # Audit: ssh.InsecureIgnoreHostKey
        - G107  # SSRF via variable URL
        - G108  # pprof endpoint exposed
        - G109  # Potential integer overflow
        - G110  # Potential DoS via decompression bomb
        - G111  # Potential directory traversal
        - G112  # Slowloris attack
        - G113  # Usage of Rat.SetString
        - G114  # Use of net/http serve function with no timeouts
        - G201  # SQL string formatting
        - G202  # SQL string concatenation
        - G203  # Use of unescaped data in HTML templates
        - G204  # Audit: use of exec.Command
        - G301  # Poor file permissions with os.Mkdir
        - G302  # Poor file permissions with os.Chmod
        - G303  # Poor file permissions with os.Create
        - G304  # File path provided as taint input
        - G305  # File traversal with filepath.Clean
        - G306  # Poor file permissions with os.WriteFile
        - G401  # Use of weak crypto: MD5
        - G402  # Use of weak TLS: MinVersion
        - G403  # Use of weak crypto: RSA
        - G404  # Use of weak random number: math/rand
        - G501  # Import blocklist: crypto/md5
        - G502  # Import blocklist: crypto/des
        - G503  # Import blocklist: crypto/rc4
        - G504  # Import blocklist: net/http/pprof
        - G505  # Import blocklist: crypto/sha1
        - G601  # Implicit memory aliasing in range
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 3
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 7
          severity: warning
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - funlen
          - maintidx
          - gocognit
          - gocyclo
        path: _test\.go$
      - linters:
          - nolintlint
        path: 'pkg/tools/(i2c\.go|spi\.go)$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
    golines:
      max-len: 120
